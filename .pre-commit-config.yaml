default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: flake8
        name: flake8
        entry: poetry run flake8
        language: system
        types: [python]
        stages: [pre-commit]
      - id: mypy
        name: mypy
        entry: poetry run mypy
        language: system
        types: [python]
        pass_filenames: true   # evalua solo los archivos modificados
        stages: [pre-push]      # más lento, mejor en push