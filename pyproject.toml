[project]
name = "mazegen"
version = "0.1.0"
description = "Maze generator package"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "flake8 (>=7.4.1,<8.0.0)",
    "mypy (>=2.4.0,<3.0.0)"
]

[tool.mypy]
plugins = [
    "pydantic.mypy"
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "flake8 (>=7.4.1,<8.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
]
